    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Teko', sans-serif;
        text-transform: uppercase;
      }
      .card-shine {
        background: linear-gradient(
          115deg,
          transparent 20%,
          rgba(255, 255, 255, 0.3) 40%,
          rgba(255, 255, 255, 0.6) 50%,
          rgba(255, 255, 255, 0.3) 60%,
          transparent 80%
        );
        background-size: 200% 200%;
        background-position: 200% 0;
      }
      .group:hover .card-shine, .card-shine-active {
        animation: shine 4s ease-out;
      }
      @keyframes shine {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Hero card showcase rotation */
      @keyframes card-showcase {
        0%, 100% { transform: rotateY(-22deg); }
        50% { transform: rotateY(22deg); }
      }
      .card-showcase {
        animation: card-showcase 10s ease-in-out infinite;
      }
      .card-showcase:hover {
        animation-play-state: paused;
        transform: rotateY(0deg);
      }

      /* Reflective glare that moves with card rotation */
      @keyframes card-glare {
        0%, 100% { opacity: 0; left: 70%; }
        25% { opacity: 0.15; left: 30%; }
        50% { opacity: 0; left: -10%; }
        75% { opacity: 0.15; left: 70%; }
      }
      .card-glare {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        overflow: hidden;
        border-radius: inherit;
      }
      .card-glare::after {
        content: '';
        position: absolute;
        top: -20%;
        width: 40%;
        height: 140%;
        background: linear-gradient(
          105deg,
          transparent 20%,
          rgba(255, 255, 255, 0.12) 40%,
          rgba(255, 255, 255, 0.25) 50%,
          rgba(255, 255, 255, 0.12) 60%,
          transparent 80%
        );
        animation: card-glare 10s ease-in-out infinite;
        transform: skewX(-15deg);
      }
      .card-showcase:hover .card-glare::after {
        animation-play-state: paused;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .card-shine { animation: none; }
        .gradient-btn { transition: none; }
        .gradient-btn::before { transition: none; }
        .stadium-sweep { animation: none; }
        * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }

      /* Stadium background for the visitor gallery carousel: sweeping floodlights
         over an illustrated crowd silhouette, so cards feel like they're "on the field". */
      .stadium-section {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, #0b1220 0%, #05070d 70%);
      }
      .stadium-haze {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 100%, rgba(245, 158, 11, 0.12), transparent 60%);
        pointer-events: none;
      }
      .stadium-sweep {
        position: absolute;
        top: -30%;
        left: 50%;
        width: 18%;
        min-width: 140px;
        height: 200%;
        opacity: 0.14;
        background: linear-gradient(180deg, #93c5fd, transparent 65%);
        transform-origin: top center;
        animation: stadium-sweep 9s ease-in-out infinite;
        pointer-events: none;
      }
      .stadium-sweep-2 {
        animation-delay: -4.5s;
        opacity: 0.1;
        background: linear-gradient(180deg, #fbbf24, transparent 65%);
      }
      @keyframes stadium-sweep {
        0%, 100% { transform: translateX(-220%) rotate(-20deg); }
        50% { transform: translateX(140%) rotate(14deg); }
      }
      /* Coverflow center card grows to feel more prominent. This lives on a child of
         .swiper-slide rather than the slide itself, because Swiper drives the slide's own
         transform via inline style and would override a scale set on that same element.
         (The reduced-motion block above already zeroes this transition's duration.) */
      .coverflow-card {
        transition: transform 0.4s ease;
      }
      .swiper-slide-active .coverflow-card {
        transform: scale(1.15);
      }
      .stadium-crowd {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 14%;
        min-height: 28px;
        background: #05070d;
        clip-path: polygon(0% 40%,4% 55%,8% 35%,12% 60%,16% 30%,20% 58%,24% 42%,28% 62%,32% 38%,36% 55%,40% 30%,44% 60%,48% 42%,52% 58%,56% 34%,60% 62%,64% 40%,68% 56%,72% 32%,76% 60%,80% 44%,84% 58%,88% 36%,92% 60%,96% 40%,100% 55%,100% 100%,0% 100%);
        pointer-events: none;
      }

      /* Carbon fibre texture (self-hosted, replaces transparenttextures.com) */
      .carbon-fibre {
        background-image:
          linear-gradient(27deg, #151515 5px, transparent 5px),
          linear-gradient(207deg, #151515 5px, transparent 5px),
          linear-gradient(27deg, #222 5px, transparent 5px),
          linear-gradient(207deg, #222 5px, transparent 5px),
          linear-gradient(90deg, #1b1b1b 10px, transparent 10px),
          linear-gradient(#1d1d1d 25%, #1a1a1a 25%, #1a1a1a 50%, transparent 50%, transparent 75%, #242424 75%, #242424);
        background-size: 20px 20px;
      }

      /* Focus States - keyboard navigation */
      button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
        outline: 2px solid #fbbf24;
        outline-offset: 2px;
      }

      /* Gradient Buttons */
      @property --pos-x { syntax: '<percentage>'; initial-value: 11.14%; inherits: false; }
      @property --pos-y { syntax: '<percentage>'; initial-value: 140%; inherits: false; }
      @property --spread-x { syntax: '<percentage>'; initial-value: 150%; inherits: false; }
      @property --spread-y { syntax: '<percentage>'; initial-value: 180.06%; inherits: false; }
      @property --gcolor-1 { syntax: '<color>'; initial-value: #000; inherits: false; }
      @property --gcolor-2 { syntax: '<color>'; initial-value: #140800; inherits: false; }
      @property --gcolor-3 { syntax: '<color>'; initial-value: #2d1500; inherits: false; }
      @property --gcolor-4 { syntax: '<color>'; initial-value: #5c2e00; inherits: false; }
      @property --gcolor-5 { syntax: '<color>'; initial-value: #7c4400; inherits: false; }
      @property --border-angle { syntax: '<angle>'; initial-value: 20deg; inherits: true; }
      @property --border-color-1 { syntax: '<color>'; initial-value: hsla(38, 92%, 60%, 0.2); inherits: true; }
      @property --border-color-2 { syntax: '<color>'; initial-value: hsla(38, 92%, 60%, 0.75); inherits: true; }
      @property --gstop-1 { syntax: '<percentage>'; initial-value: 37.35%; inherits: false; }
      @property --gstop-2 { syntax: '<percentage>'; initial-value: 61.36%; inherits: false; }
      @property --gstop-3 { syntax: '<percentage>'; initial-value: 78.42%; inherits: false; }
      @property --gstop-4 { syntax: '<percentage>'; initial-value: 89.52%; inherits: false; }
      @property --gstop-5 { syntax: '<percentage>'; initial-value: 100%; inherits: false; }

      .gradient-btn {
        position: relative;
        appearance: none;
        cursor: pointer;
        background: radial-gradient(
          var(--spread-x) var(--spread-y) at var(--pos-x) var(--pos-y),
          var(--gcolor-1) var(--gstop-1),
          var(--gcolor-2) var(--gstop-2),
          var(--gcolor-3) var(--gstop-3),
          var(--gcolor-4) var(--gstop-4),
          var(--gcolor-5) var(--gstop-5)
        );
        transition:
          --pos-x 0.5s, --pos-y 0.5s,
          --spread-x 0.5s, --spread-y 0.5s,
          --gcolor-1 0.5s, --gcolor-2 0.5s, --gcolor-3 0.5s, --gcolor-4 0.5s, --gcolor-5 0.5s,
          --border-angle 0.5s, --border-color-1 0.5s, --border-color-2 0.5s,
          --gstop-1 0.5s, --gstop-2 0.5s, --gstop-3 0.5s, --gstop-4 0.5s, --gstop-5 0.5s;
      }

      .gradient-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(var(--border-angle), var(--border-color-1), var(--border-color-2));
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        pointer-events: none;
      }

      .gradient-btn:hover {
        --pos-x: 0%;
        --pos-y: 91.51%;
        --spread-x: 120.24%;
        --spread-y: 103.18%;
        --gcolor-1: #f59e0b;
        --gcolor-2: #d97706;
        --gcolor-3: #fbbf24;
        --gcolor-4: #1a0800;
        --gcolor-5: #000;
        --border-angle: 190deg;
        --border-color-1: hsla(38, 92%, 90%, 0.1);
        --border-color-2: hsla(38, 92%, 90%, 0.6);
        --gstop-1: 0%;
        --gstop-2: 8.8%;
        --gstop-3: 21.44%;
        --gstop-4: 71.34%;
        --gstop-5: 85.76%;
      }

      .gradient-btn-primary {
        --gcolor-1: #100500;
        --gcolor-2: #2d1500;
        --gcolor-3: #7c4400;
        --gcolor-4: #d97706;
        --border-angle: 200deg;
        --border-color-1: hsla(38, 92%, 90%, 0.6);
        --border-color-2: hsla(38, 70%, 90%, 0.15);
      }

      .gradient-btn-primary:hover {
        --pos-x: 0%;
        --pos-y: 95.51%;
        --spread-x: 110.24%;
        --spread-y: 110.2%;
        --gcolor-1: #100500;
        --gcolor-2: #fbbf24;
        --gcolor-3: #d97706;
        --gcolor-4: #2d1500;
        --gcolor-5: #000;
        --gstop-1: 0%;
        --gstop-2: 10%;
        --gstop-3: 35.44%;
        --gstop-4: 71.34%;
        --gstop-5: 90.76%;
        --border-angle: 210deg;
        --border-color-1: hsla(38, 92%, 90%, 0.2);
        --border-color-2: hsla(38, 70%, 90%, 0.75);
      }
    </style>
  </head>
