<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProCard Legends - Youth Sports Custom Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300;400;500;600;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" sizes="180x180" href="/appicon.png" />
    <link rel="icon" href="/favicon.png" type="image/png">

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Teko', sans-serif;
        text-transform: uppercase;
      }
      .card-shine {
        background: linear-gradient(
          115deg,
          transparent 20%,
          rgba(255, 255, 255, 0.3) 40%,
          rgba(255, 255, 255, 0.6) 50%,
          rgba(255, 255, 255, 0.3) 60%,
          transparent 80%
        );
        background-size: 200% 200%;
        animation: shine 4s infinite linear;
      }
      @keyframes shine {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Gradient Buttons */
      @property --pos-x { syntax: '<percentage>'; initial-value: 11.14%; inherits: false; }
      @property --pos-y { syntax: '<percentage>'; initial-value: 140%; inherits: false; }
      @property --spread-x { syntax: '<percentage>'; initial-value: 150%; inherits: false; }
      @property --spread-y { syntax: '<percentage>'; initial-value: 180.06%; inherits: false; }
      @property --gcolor-1 { syntax: '<color>'; initial-value: #000; inherits: false; }
      @property --gcolor-2 { syntax: '<color>'; initial-value: #0a0128; inherits: false; }
      @property --gcolor-3 { syntax: '<color>'; initial-value: #1e2e4e; inherits: false; }
      @property --gcolor-4 { syntax: '<color>'; initial-value: #2d4670; inherits: false; }
      @property --gcolor-5 { syntax: '<color>'; initial-value: #3b4c88; inherits: false; }
      @property --border-angle { syntax: '<angle>'; initial-value: 20deg; inherits: true; }
      @property --border-color-1 { syntax: '<color>'; initial-value: hsla(200, 75%, 60%, 0.2); inherits: true; }
      @property --border-color-2 { syntax: '<color>'; initial-value: hsla(270, 75%, 60%, 0.75); inherits: true; }
      @property --gstop-1 { syntax: '<percentage>'; initial-value: 37.35%; inherits: false; }
      @property --gstop-2 { syntax: '<percentage>'; initial-value: 61.36%; inherits: false; }
      @property --gstop-3 { syntax: '<percentage>'; initial-value: 78.42%; inherits: false; }
      @property --gstop-4 { syntax: '<percentage>'; initial-value: 89.52%; inherits: false; }
      @property --gstop-5 { syntax: '<percentage>'; initial-value: 100%; inherits: false; }

      .gradient-btn {
        position: relative;
        appearance: none;
        cursor: pointer;
        background: radial-gradient(
          var(--spread-x) var(--spread-y) at var(--pos-x) var(--pos-y),
          var(--gcolor-1) var(--gstop-1),
          var(--gcolor-2) var(--gstop-2),
          var(--gcolor-3) var(--gstop-3),
          var(--gcolor-4) var(--gstop-4),
          var(--gcolor-5) var(--gstop-5)
        );
        transition:
          --pos-x 0.5s, --pos-y 0.5s,
          --spread-x 0.5s, --spread-y 0.5s,
          --gcolor-1 0.5s, --gcolor-2 0.5s, --gcolor-3 0.5s, --gcolor-4 0.5s, --gcolor-5 0.5s,
          --border-angle 0.5s, --border-color-1 0.5s, --border-color-2 0.5s,
          --gstop-1 0.5s, --gstop-2 0.5s, --gstop-3 0.5s, --gstop-4 0.5s, --gstop-5 0.5s;
      }

      .gradient-btn::before {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(var(--border-angle), var(--border-color-1), var(--border-color-2));
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        pointer-events: none;
      }

      .gradient-btn:hover {
        --pos-x: 0%;
        --pos-y: 91.51%;
        --spread-x: 120.24%;
        --spread-y: 103.18%;
        --gcolor-1: #6366f1;
        --gcolor-2: #7c3aed;
        --gcolor-3: #06b6d4;
        --gcolor-4: #0a1628;
        --gcolor-5: #000;
        --border-angle: 190deg;
        --border-color-1: hsla(200, 78%, 90%, 0.1);
        --border-color-2: hsla(270, 75%, 90%, 0.6);
        --gstop-1: 0%;
        --gstop-2: 8.8%;
        --gstop-3: 21.44%;
        --gstop-4: 71.34%;
        --gstop-5: 85.76%;
      }

      .gradient-btn-primary {
        --gcolor-1: #0a0020;
        --gcolor-2: #1e1a4e;
        --gcolor-3: #4c2889;
        --gcolor-4: #7c3aed;
        --border-angle: 200deg;
        --border-color-1: hsla(270, 75%, 90%, 0.6);
        --border-color-2: hsla(200, 50%, 90%, 0.15);
      }

      .gradient-btn-primary:hover {
        --pos-x: 0%;
        --pos-y: 95.51%;
        --spread-x: 110.24%;
        --spread-y: 110.2%;
        --gcolor-1: #0a0020;
        --gcolor-2: #a78bfa;
        --gcolor-3: #7c3aed;
        --gcolor-4: #1e1a4e;
        --gcolor-5: #000;
        --gstop-1: 0%;
        --gstop-2: 10%;
        --gstop-3: 35.44%;
        --gstop-4: 71.34%;
        --gstop-5: 90.76%;
        --border-angle: 210deg;
        --border-color-1: hsla(270, 75%, 90%, 0.2);
        --border-color-2: hsla(200, 50%, 90%, 0.75);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
